name: CI/CD - Master

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test test/data/cubits/cubits_test.dart -j 1

  cd:
    name: Shorebird Release & GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          shorebird-version: 'latest'

      - name: Get dependencies
        run: flutter pub get

      - name: Shorebird release (Android)
        id: shorebird-android
        run: |
          shorebird release android --platforms=android-arm64,android-arm \
            --artifact=apk \
            --flutter-version=$(flutter --version | head -1 | cut -d' ' -f2)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Shorebird release (iOS)
        id: shorebird-ios
        if: runner.os == 'macOS'
        run: |
          shorebird release ios \
            --flutter-version=$(flutter --version | head -1 | cut -d' ' -f2)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}