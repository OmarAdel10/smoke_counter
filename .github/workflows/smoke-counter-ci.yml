name: CI - Development

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test
